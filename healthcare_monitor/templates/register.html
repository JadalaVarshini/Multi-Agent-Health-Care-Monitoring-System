{% extends "auth_base.html" %}{% block title %}Create account · MediAgents{% endblock %}
{% block body %}<div class="card"><h1>Create your account</h1>
<form method="post"><label>Full name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password (min 6 characters)</label><input name="password" type="password" minlength="6" required>
<div class="grid g3"><div><label>Age</label><input name="age" type="number" min="0" max="120"></div>
<div><label>Gender</label><select name="gender"><option>Female</option><option>Male</option><option>Other</option></select></div>
<div><label>Height (cm)</label><input name="height_cm" type="number" step="0.1"></div></div>
<label>Phone</label><input name="phone">
<div class="grid g2"><div><label>Emergency contact name</label><input name="emergency_name"></div><div><label>Emergency contact phone</label><input name="emergency_phone"></div></div>
<button class="btn" style="width:100%;margin-top:18px">Register</button></form>
<p class="small" style="text-align:center;margin-top:14px"><a href="{{ url_for('login') }}">Back to sign in</a></p></div>{% endblock %}
