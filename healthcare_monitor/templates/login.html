{% extends "auth_base.html" %}{% block title %}Sign in · MediAgents{% endblock %}
{% block body %}<div class="card"><h1>MediAgents</h1><p class="small" style="text-align:center;margin:0"><span class="pill info">Patient login</span></p><p class="mute" style="text-align:center;margin:0 0 8px">Multi-Agent Healthcare Monitoring System</p>
<form method="post"><label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
<label for="pw">Password</label><input id="pw" name="password" type="password" required>
<button class="btn" style="width:100%;margin-top:18px">Sign in</button></form>
<p class="small mute" style="text-align:center;margin-top:16px">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
<p class="small" style="text-align:center;margin:0 0 6px">Are you a doctor? <a href="{{ url_for('doctor_login') }}">Doctor login</a></p>
<p class="small mute" style="text-align:center;margin:0">Demo: <code>demo@health.com</code> / <code>demo123</code></p></div>{% endblock %}
