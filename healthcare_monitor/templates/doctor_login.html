{% extends "auth_base.html" %}{% block title %}Doctor sign in · MediAgents{% endblock %}
{% block body %}<div class="card"><h1>MediAgents</h1><p class="small" style="text-align:center;margin:0"><span class="pill info">Doctor login</span></p>
<p class="mute" style="text-align:center;margin:8px 0">Manage appointments, patients and prescriptions</p>
<form method="post"><label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
<label for="pw">Password</label><input id="pw" name="password" type="password" required>
<button class="btn" style="width:100%;margin-top:18px">Sign in as doctor</button></form>
<p class="small mute" style="text-align:center;margin-top:16px">New doctor? <a href="{{ url_for('doctor_register') }}">Register here</a></p>
<p class="small" style="text-align:center;margin:0 0 6px">Are you a patient? <a href="{{ url_for('login') }}">Patient login</a></p>
<p class="small mute" style="text-align:center;margin:0">Demo: <code>doctor@health.com</code> / <code>doctor123</code></p></div>{% endblock %}
